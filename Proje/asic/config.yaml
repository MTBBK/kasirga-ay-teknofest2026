USE_SLANG: true

CLOCK_PORT: clk_i_50mHz
CLOCK_PERIOD: 40.0

CLOCK_NET:
  - clk_i_50mHz
  #- clk_div/clk_25mhz_o

PNR_SDC_FILE: dir::constraints/design.sdc
SIGNOFF_SDC_FILE: dir::constraints/design.sdc

# --- Floorplan / Yerlesim Yogunlugu ---
FP_SIZING: absolute
DIE_AREA: [0, 0, 5500, 5200]
FP_CORE_UTIL: 25
PL_TARGET_DENSITY_PCT: expr::($FP_CORE_UTIL + 10.0)

# --- Resizer (Zamanlama Onarimi) ---
PL_RESIZER_SETUP_SLACK_MARGIN: 0.5
PL_RESIZER_SETUP_MAX_BUFFER_PCT: 100
RUN_POST_GRT_RESIZER_TIMING: true
GRT_RESIZER_SETUP_SLACK_MARGIN: 0.5
GRT_RESIZER_SETUP_MAX_BUFFER_PCT: 100

# CONFIRMED GOOD: dropped slew violations 8775->5197, cap 723->570 at
# max_ss_100C_1v60 by forcing buffer insertion on long nets (default
# threshold was 6884u, far too loose for this floorplan).
DESIGN_REPAIR_MAX_WIRE_LENGTH: 800

# CONFIRMED GOOD: 50 -> 80. Reg-to-reg hold violations went from 6 -> 0
# fully resolved. Remaining hold violations are all port-to-register
# (qspi_io_1, gpio_i[*], fetch_enable, uart_rx_i -> first-stage flops),
# a separate mechanism being addressed via SDC -min input delay instead.
PL_RESIZER_HOLD_SLACK_MARGIN: 0.05
PL_RESIZER_HOLD_MAX_BUFFER_PCT: 100
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.05
GRT_RESIZER_HOLD_MAX_BUFFER_PCT: 100

# CONFIRMED: reverted 20 -> 40. Shrinking halo to 20 made every metric
# worse (hold WNS -0.66->-1.04ns, hold count 154->187, slew 8775->10347) -
# less halo room hurts routing/buffering more than it helps site
# availability. Do not shrink this again without new evidence.
FP_MACRO_HORIZONTAL_HALO: 40
FP_MACRO_VERTICAL_HALO: 40

# --- Sentez (Alan Odakli Stabil Strateji) ---
#SYNTH_STRATEGY: "DELAY 0"
#SYNTH_SIZING: true
MAX_FANOUT_CONSTRAINT: 4
MAX_TRANSITION_CONSTRAINT: 1.0
# NOTE: left unchanged. Dominant slew violations trace to the SRAM's own
# fixed 40ps max_transition Liberty spec on macro address pins, not this
# global constraint.

# --- Saat Agaci (CTS) ---
# NOTE: left unchanged. Confirmed clock-tree nets account for only 13 of
# 12497 lines in the max_ss_100C_1v60 violator list - ruled out as cause
# of slew/cap violations.
CTS_MAX_CAP: 0.15
CTS_SINK_CLUSTERING_MAX_DIAMETER: 15
CTS_SINK_CLUSTERING_SIZE: 8
GRT_OVERFLOW_ITERS: 50
GRT_ALLOW_CONGESTION: true

# --- Guc Dagitim Agi (PDN) ---
VDD_NETS:
  - vccd1
GND_NETS:
  - vssd1
PDN_ENABLE_GLOBAL_CONNECTIONS: true
VERILOG_POWER_DEFINE: "DISABLE_POWER_PINS_TRICK"
PDN_MACRO_CONNECTIONS:
  - 'accelerator_memory.* vccd1 vssd1 vccd1 vssd1'
  - 'data_memory.* vccd1 vssd1 vccd1 vssd1'
  - 'instruction_memory.* vccd1 vssd1 vccd1 vssd1'

WELLTAP_CELL: sky130_fd_sc_hd__tapvpwrvgnd_1
ENDCAP_CELL: sky130_fd_sc_hd__decap_3

# UNRESOLVED: MAGIC_DISABLE_HIER_GDS: true did NOT fix the XOR mismatch
# (82,996,244 -> 82,994,325, essentially unchanged). Hierarchy-flattening
# theory is disproven. Kept enabled since it's not harmful, but the real
# cause of the ~83M diff items is still under investigation - awk/grep
# on xor.xml so far hasn't isolated which GDS layer(s) carry the diffs.
# Needs a proper KLayout report-DB-aware query (e.g. via klayout -b with
# a script reading the .lyrdb/xor.xml structure properly, or opening
# xor.xml directly in the KLayout GUI's marker browser) before further
# config changes are justified. Do not guess at another config fix here.
MAGIC_DISABLE_HIER_GDS: true
PRIMARY_GDSII_STREAMOUT_TOOL: klayout

