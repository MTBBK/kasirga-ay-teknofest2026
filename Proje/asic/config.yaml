  - dir::../TopModules/asic_top.sv


VERILOG_INCLUDE_DIRS:
  - dir::../Core/rtl/include
  - dir::../Core/rtl/vendor/pulp_platform_common_cells/include

USE_SLANG: true

CLOCK_PORT: clk_i_100mHz
CLOCK_PERIOD: 10   # 50MHz veya 100MHz hedefinize gore revize edin

PNR_SDC_FILE: dir::constraints/design.sdc
SIGNOFF_SDC_FILE: dir::constraints/design.sdc

# --- Floorplan / Yerlesim Yogunlugu ---
FP_SIZING: relative
FP_CORE_UTIL: 35
PL_TARGET_DENSITY_PCT: expr::($FP_CORE_UTIL + 10.0)

# --- Resizer (Zamanlama Onarimi) ---
PL_RESIZER_SETUP_SLACK_MARGIN: 0.5
PL_RESIZER_SETUP_MAX_BUFFER_PCT: 100
RUN_POST_GRT_RESIZER_TIMING: true
GRT_RESIZER_SETUP_SLACK_MARGIN: 0.5
GRT_RESIZER_SETUP_MAX_BUFFER_PCT: 100

PL_RESIZER_HOLD_SLACK_MARGIN: 0.15
PL_RESIZER_HOLD_MAX_BUFFER_PCT: 80
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.15
GRT_RESIZER_HOLD_MAX_BUFFER_PCT: 80

PL_RESIZER_MAX_SLEW_MARGIN: 20
PL_RESIZER_MAX_CAP_MARGIN: 20

# --- Sentez (Alan Odakli Stabil Strateji) ---
SYNTH_STRATEGY: "DELAY 0"
SYNTH_SIZING: true
MAX_FANOUT_CONSTRAINT: 16
SYNTH_MAX_FANOUT: 16
MAX_TRANSITION_CONSTRAINT: 1.0

# --- Saat Agaci (CTS) ---
CTS_MAX_CAP: 0.15
CTS_SINK_CLUSTERING_SIZE: 20
CTS_SINK_CLUSTERING_MAX_DIAMETER: 50
GRT_OVERFLOW_ITERS: 50
GRT_ALLOW_CONGESTION: true
# --- Guc Dagitim Agi (PDN) ---
VDD_NETS:
  - vpwr
GND_NETS:
  - vgnd
FP_PDN_ENABLE_GLOBAL_CONNECTIONS: true
VDD_PIN_VOLTAGE: 1.8
SYNTH_USE_PG_PINS_DEFINES: "USE_POWER_PINS"

FP_WELLTAP_CELL: sky130_fd_sc_hd__tapvpwrvgnd_1
FP_ENDCAP_CELL: sky130_fd_sc_hd__decap_3

